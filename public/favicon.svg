<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#22402f"/>
      <stop offset="55%" stop-color="#16241c"/>
      <stop offset="100%" stop-color="#0f1a14"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- translucent capital B, centered on the Vitruvian box (center ≈ 261,287) -->
  <text x="261" y="287" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, serif" font-weight="700" font-size="430"
        fill="#8fd6a4" opacity="0.13">B</text>

  <g stroke="#8fd6a4" fill="none" stroke-linecap="round">
    <!-- Vitruvian frame -->
    <rect x="92" y="118" width="338" height="338" rx="10" stroke-width="9" opacity="0.55"/>
    <circle cx="256" cy="287" r="169" stroke-width="9" opacity="0.75"/>
    <!-- head -->
    <circle cx="256" cy="152" r="27" stroke-width="11"/>
    <!-- torso -->
    <line x1="256" y1="179" x2="256" y2="320" stroke-width="11"/>
    <!-- arms (two positions) -->
    <line x1="256" y1="220" x2="138" y2="220" stroke-width="11"/>
    <line x1="256" y1="220" x2="374" y2="220" stroke-width="11"/>
    <line x1="256" y1="210" x2="158" y2="152" stroke-width="11" opacity="0.6"/>
    <line x1="256" y1="210" x2="354" y2="152" stroke-width="11" opacity="0.6"/>
    <!-- legs (two positions) -->
    <line x1="256" y1="320" x2="225" y2="438" stroke-width="11"/>
    <line x1="256" y1="320" x2="287" y2="438" stroke-width="11"/>
    <line x1="256" y1="320" x2="174" y2="432" stroke-width="11" opacity="0.6"/>
    <line x1="256" y1="320" x2="338" y2="432" stroke-width="11" opacity="0.6"/>
  </g>
</svg>
